app = "REPLACE_WITH_FLY_APP_NAME"
kill_signal = "SIGINT"
kill_timeout = 5

[build]
  dockerfile = "Dockerfile"

[env]
  LIMANYA_HOST = "0.0.0.0"
  LIMANYA_PORT = "8000"
  LIMANYA_DB_PATH = "/data/limanya.db"

[[services]]
  internal_port = 8000
  protocol = "tcp"
  [services.concurrency]
    hard_limit = 25
    soft_limit = 20
  [[services.ports]]
    handlers = ["http"]
    port = 80
  [[services.ports]]
    handlers = ["tls"]
    port = 443

[mounts]
  source = "limanya-data"
  destination = "/data"
